<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LIGHTEND</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: #000;
      font-family: 'Courier New', monospace;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }
    #root {
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel">
    const { useState, useRef, useEffect, useCallback } = React;

    const LIGHTEND = () => {
      const canvasRef = useRef(null);
      const gameStateRef = useRef(null);
      const animationIdRef = useRef(null);
      const audioContextRef = useRef(null);
      const soundsRef = useRef({});
      const lastTimeRef = useRef(Date.now());

      const [screen, setScreen] = useState('menu');
      const [gameMode, setGameMode] = useState('survival');
      const [score, setScore] = useState(0);
      const [combo, setCombo] = useState(0);
      const [gridHealth, setGridHealth] = useState(100);
      const [time, setTime] = useState(0);
      const [soundEnabled, setSoundEnabled] = useState(true);
      const [hapticsEnabled, setHapticsEnabled] = useState(true);
      const [bestScore, setBestScore] = useState(() => {
        const saved = localStorage.getItem('lightend_bestScore');
        return saved ? parseInt(saved) : 0;
      });

      const initAudio = useCallback(() => {
        if (audioContextRef.current) return;
        try {
          const audioContext = new (window.AudioContext || window.webkitAudioContext)();
          audioContextRef.current = audioContext;
          soundsRef.current = {
            intercept: () => playTone(audioContext, 800, 0.1, 0.15),
            perfectIntercept: () => playTone(audioContext, 1200, 0.15, 0.2),
            strike: () => playThunder(audioContext),
          };
        } catch (e) {
          console.log('Audio unavailable');
        }
      }, []);

      const playTone = (audioContext, frequency, volume, duration) => {
        if (!soundEnabled || !audioContext) return;
        try {
          const osc = audioContext.createOscillator();
          const gain = audioContext.createGain();
          osc.connect(gain);
          gain.connect(audioContext.destination);
          osc.frequency.value = frequency;
          gain.gain.setValueAtTime(volume, audioContext.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + duration);
          osc.start(audioContext.currentTime);
          osc.stop(audioContext.currentTime + duration);
        } catch (e) {}
      };

      const playThunder = (audioContext, volume = 0.2) => {
        if (!soundEnabled || !audioContext) return;
        try {
          const now = audioContext.currentTime;
          const gain = audioContext.createGain();
          gain.connect(audioContext.destination);
          for (let i = 0; i < 2; i++) {
            const osc = audioContext.createOscillator();
            osc.connect(gain);
            osc.frequency.value = Math.random() * 80 + 40;
            osc.start(now + i * 0.02);
            osc.stop(now + i * 0.02 + 0.08);
          }
          gain.gain.setValueAtTime(volume, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
        } catch (e) {}
      };

      const triggerHaptic = (pattern = 'medium') => {
        if (!hapticsEnabled || !navigator.vibrate) return;
        const patterns = {
          small: [10],
          medium: [30],
          strong: [60],
          perfect: [50, 30, 50],
        };
        try {
          navigator.vibrate(patterns[pattern] || patterns.medium);
        } catch (e) {}
      };

      const createGameState = (mode) => {
        const targets = [
          { id: 'tree1', x: 0.15, y: 0.7, type: 'tree', health: 100, damagePct: 3 },
          { id: 'tree2', x: 0.85, y: 0.75, type: 'tree', health: 100, damagePct: 3 },
          { id: 'pole1', x: 0.35, y: 0.65, type: 'pole', health: 100, damagePct: 10 },
          { id: 'pole2', x: 0.65, y: 0.68, type: 'pole', health: 100, damagePct: 10 },
          { id: 'house1', x: 0.25, y: 0.65, type: 'house', health: 100, damagePct: 5 },
          { id: 'house2', x: 0.75, y: 0.62, type: 'house', health: 100, damagePct: 5 },
          { id: 'tower', x: 0.5, y: 0.3, type: 'tower', health: 100, damagePct: 15 },
        ];
        return {
          mode,
          score: 0,
          combo: 0,
          gridHealth: 100,
          time: 0,
          startTime: Date.now(),
          isPaused: false,
          isGameOver: false,
          interceptionActive: false,
          interceptionPosition: null,
          interceptionStartTime: null,
          interceptionCooldown: 0,
          lightning: [],
          streamers: [],
          strikeTargets: targets,
          particles: [],
          stormIntensity: 0,
          intensityRamp: 0.3,
        };
      };

      const generateStreamerBranches = (count) => {
        const branches = [];
        for (let i = 0; i < count; i++) {
          const angle = Math.random() * Math.PI * 2;
          const length = Math.random() * 0.08 + 0.02;
          branches.push({ angle, length, x: Math.cos(angle) * length, y: Math.sin(angle) * length });
        }
        return branches;
      };

      const generateStreamers = (gameState) => {
        gameState.streamers = gameState.strikeTargets
          .filter(() => Math.random() > 0.4)
          .map((target, idx) => ({
            id: idx,
            targetObject: target,
            strength: Math.random() * 0.8 + 0.2,
            startTime: gameState.time,
            isActive: true,
            branches: generateStreamerBranches(15),
          }));
      };

      const generateLightningStrike = (gameState, elapsed) => {
        const intensity = Math.min(gameState.stormIntensity, 1);
        const frequency = 2 + intensity * 8;
        if (Math.random() > (frequency / 60 / 60)) return;

        const targetIdx = Math.floor(Math.random() * Math.max(1, gameState.streamers.length));
        const leader = {
          id: Math.random(),
          startTime: elapsed,
          x: 0.44 + Math.random() * 0.12,
          y: 0.22,
          targetStreamerIndex: targetIdx,
          branches: [],
          path: [],
          isActive: true,
          interceptionSucceeded: false,
        };

        const target = gameState.streamers[leader.targetStreamerIndex];
        if (target) {
          const targetX = target.targetObject.x;
          const targetY = target.targetObject.y;
          const segments = 18;
          for (let i = 0; i <= segments; i++) {
            const t = i / segments;
            leader.path.push({
              x: leader.x + (targetX - leader.x) * t + (i === 0 || i === segments ? 0 : (Math.random() - 0.5) * 0.055),
              y: leader.y + (targetY - leader.y) * t,
            });
          }
          for (let i = 0; i < 5; i++) {
            leader.branches.push({
              startX: leader.x,
              startY: leader.y + (i / 4) * target.targetObject.y * 0.7,
              offsetX: (Math.random() - 0.5) * 0.15,
              depth: i,
            });
          }
        }

        gameState.lightning.push(leader);
      };

      const updateGameLogic = (gameState, elapsed, deltaTime) => {
        if (gameState.isPaused || gameState.isGameOver) return;

        gameState.time = elapsed;
        if (gameState.mode === 'sixtySecond') {
          gameState.time = Math.floor((Date.now() - gameState.startTime) / 1000);
          if (gameState.time >= 60) gameState.isGameOver = true;
        }

        gameState.stormIntensity = Math.min(
          gameState.stormIntensity + gameState.intensityRamp * deltaTime / 1000,
          1
        );

        if (gameState.streamers.length < 3 || Math.random() > 0.98) {
          const newStreamer = gameState.strikeTargets
            .filter(() => Math.random() > 0.6)
            .map((target) => ({
              id: Math.random(),
              targetObject: target,
              strength: Math.random() * 0.8 + 0.2,
              startTime: gameState.time,
              isActive: true,
              branches: generateStreamerBranches(15),
            }));
          gameState.streamers.push(...newStreamer);
        }

        generateLightningStrike(gameState, elapsed);

        gameState.lightning = gameState.lightning.filter((leader) => {
          const age = gameState.time - leader.startTime;
          const maxDuration = 2 / (1 + gameState.stormIntensity * 2);

          if (age > maxDuration) {
            if (!leader.interceptionSucceeded && leader.targetStreamerIndex < gameState.streamers.length) {
              triggerHaptic('strong');
              soundsRef.current.strike?.();
              const streamer = gameState.streamers[leader.targetStreamerIndex];
              if (streamer) {
                gameState.gridHealth = Math.max(0, gameState.gridHealth - streamer.targetObject.damagePct);
                gameState.combo = 0;
                for (let i = 0; i < 20; i++) {
                  gameState.particles.push({
                    x: streamer.targetObject.x,
                    y: streamer.targetObject.y,
                    vx: (Math.random() - 0.5) * 0.3,
                    vy: (Math.random() - 0.5) * 0.3 - 0.1,
                    life: 0.8,
                    maxLife: 0.8,
                  });
                }
              }
            }
            return false;
          }

          if (gameState.interceptionActive && !leader.interceptionSucceeded) {
            const dist = Math.hypot(
              leader.x - gameState.interceptionPosition.x,
              (leader.y + age * 0.5) - gameState.interceptionPosition.y
            );

            if (dist < 0.08) {
              leader.interceptionSucceeded = true;
              const timing = Math.min(1, age / (2 / (1 + gameState.stormIntensity * 2)));
              let points = 100;

              if (timing > 0.85) {
                points = 300;
                triggerHaptic('perfect');
                soundsRef.current.perfectIntercept?.();
              } else if (timing > 0.7) {
                points = 200;
                triggerHaptic('strong');
                soundsRef.current.intercept?.();
              } else if (timing > 0.5) {
                points = 150;
                triggerHaptic('medium');
                soundsRef.current.intercept?.();
              } else {
                triggerHaptic('medium');
                soundsRef.current.intercept?.();
              }

              gameState.score += points * (1 + gameState.combo * 0.5);
              gameState.combo += 1;

              for (let i = 0; i < 30; i++) {
                gameState.particles.push({
                  x: gameState.interceptionPosition.x,
                  y: gameState.interceptionPosition.y,
                  vx: (Math.random() - 0.5) * 0.4,
                  vy: (Math.random() - 0.5) * 0.4,
                  life: 0.6,
                  maxLife: 0.6,
                });
              }
            }
          }
          return true;
        });

        gameState.particles = gameState.particles
          .map((p) => ({
            ...p,
            x: p.x + p.vx * deltaTime / 1000,
            y: p.y + p.vy * deltaTime / 1000,
            vy: p.vy + 0.2 * deltaTime / 1000,
            life: p.life - deltaTime / 1000,
          }))
          .filter((p) => p.life > 0);

        if (gameState.interceptionCooldown > 0) {
          gameState.interceptionCooldown -= deltaTime / 1000;
        }

        if (gameState.gridHealth <= 0) {
          gameState.isGameOver = true;
        }
      };

      const renderFrame = (gameState) => {
        const canvas = canvasRef.current;
        if (!canvas) return;

        const ctx = canvas.getContext('2d');
        const width = canvas.width;
        const height = canvas.height;

        const gradient = ctx.createLinearGradient(0, 0, 0, height);
        gradient.addColorStop(0, '#1a1a2e');
        gradient.addColorStop(0.5, '#16213e');
        gradient.addColorStop(1, '#0f3460');
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, width, height);

        const horizon = height * 0.48;
        ctx.fillStyle = '#263c54';
        for (let i = 0; i < 14; i++) {
          const buildingWidth = width / 12;
          const buildingHeight = height * (0.08 + ((i * 17) % 9) * 0.012);
          const x = i * buildingWidth - buildingWidth * 0.3;
          ctx.fillRect(x, horizon - buildingHeight, buildingWidth * 0.72, buildingHeight);
          ctx.fillStyle = 'rgba(130, 180, 205, 0.22)';
          for (let row = 0; row < 3; row++) {
            ctx.fillRect(x + buildingWidth * 0.15, horizon - buildingHeight + 12 + row * 18, 5, 8);
          }
          ctx.fillStyle = '#263c54';
        }

        const groundGradient = ctx.createLinearGradient(0, horizon, 0, height);
        groundGradient.addColorStop(0, '#20374d');
        groundGradient.addColorStop(1, '#0b2035');
        ctx.fillStyle = groundGradient;
        ctx.fillRect(0, horizon, width, height - horizon);

        ctx.strokeStyle = 'rgba(92, 137, 170, 0.28)';
        ctx.lineWidth = Math.max(24, height * 0.055);
        ctx.beginPath();
        ctx.moveTo(0, height * 0.78);
        ctx.lineTo(width, height * 0.58);
        ctx.moveTo(width * 0.1, height);
        ctx.lineTo(width * 0.84, horizon);
        ctx.stroke();

        const cloudX = width * 0.5;
        const cloudY = height * 0.18;
        const cloudScale = Math.min(width, height) * 0.13;
        ctx.shadowColor = 'rgba(100, 170, 225, 0.4)';
        ctx.shadowBlur = 24;
        const cloudGradient = ctx.createLinearGradient(0, cloudY - cloudScale, 0, cloudY + cloudScale * 0.55);
        cloudGradient.addColorStop(0, '#7199bb');
        cloudGradient.addColorStop(1, '#304e6c');
        ctx.fillStyle = cloudGradient;
        [[-0.9, 0.2, 0.75], [-0.45, -0.05, 0.9], [0, -0.3, 1.05], [0.48, -0.05, 0.82], [0.9, 0.2, 0.65]].forEach(([dx, dy, size]) => {
          ctx.beginPath();
          ctx.arc(cloudX + dx * cloudScale, cloudY + dy * cloudScale, cloudScale * size, 0, Math.PI * 2);
          ctx.fill();
        });
        ctx.fillRect(cloudX - cloudScale * 1.45, cloudY, cloudScale * 2.9, cloudScale * 0.55);
        ctx.shadowBlur = 0;

        gameState.strikeTargets.forEach((target) => {
          const x = target.x * width;
          const y = target.y * height;
          const structureWidth = Math.max(34, Math.min(64, width * 0.09));
          const structureHeight = target.type === 'tower' ? structureWidth * 1.35 : structureWidth * 0.82;
          const isHub = target.type === 'tower';
          ctx.fillStyle = isHub ? '#6989a2' : '#415e75';
          ctx.strokeStyle = isHub ? '#9fd8f8' : '#779ab3';
          ctx.lineWidth = 2;
          ctx.fillRect(x - structureWidth / 2, y - structureHeight, structureWidth, structureHeight);
          ctx.strokeRect(x - structureWidth / 2, y - structureHeight, structureWidth, structureHeight);
          ctx.fillStyle = 'rgba(174, 217, 238, 0.7)';
          for (let row = 0; row < 3; row++) {
            for (let col = 0; col < 3; col++) {
              ctx.fillRect(x - structureWidth * 0.34 + col * structureWidth * 0.27, y - structureHeight + 10 + row * 15, 5, 7);
            }
          }
          const label = isHub ? 'MAIN POWER HUB' : target.type === 'house' ? 'CITY HALL' : target.type === 'pole' ? 'RELAY' : 'GRID NODE';
          ctx.font = `bold ${Math.max(9, Math.min(13, width * 0.02))}px Courier New`;
          const labelWidth = ctx.measureText(label).width + 14;
          ctx.fillStyle = 'rgba(7, 20, 33, 0.92)';
          ctx.fillRect(x - labelWidth / 2, y - structureHeight - 24, labelWidth, 19);
          ctx.fillStyle = '#d8edfa';
          ctx.textAlign = 'center';
          ctx.fillText(label, x, y - structureHeight - 10);
        });

        ctx.strokeStyle = 'rgba(105, 190, 235, 0.65)';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.ellipse(width * 0.5, height * 0.89, width * 0.28, height * 0.065, 0, 0, Math.PI * 2);
        ctx.stroke();
        ctx.strokeStyle = 'rgba(105, 190, 235, 0.28)';
        ctx.lineWidth = 12;
        ctx.stroke();
        ctx.fillStyle = 'rgba(85, 180, 225, 0.08)';
        ctx.fill();

        gameState.streamers.forEach((streamer) => {
          const x = streamer.targetObject.x * width;
          const y = streamer.targetObject.y * height;
          const age = gameState.time - streamer.startTime;
          const visibility = Math.min(1, age * 2) * streamer.strength;

          ctx.strokeStyle = `rgba(100, 150, 255, ${visibility * 0.6})`;
          ctx.lineWidth = 1;
          streamer.branches.forEach((branch) => {
            ctx.beginPath();
            ctx.moveTo(x, y);
            ctx.lineTo(x + branch.x * width, y - branch.length * height);
            ctx.stroke();
          });

          ctx.fillStyle = `rgba(100, 150, 255, ${visibility * 0.1})`;
          ctx.beginPath();
          ctx.arc(x, y, 10 * visibility, 0, Math.PI * 2);
          ctx.fill();
        });

        gameState.lightning.forEach((leader) => {
          const age = gameState.time - leader.startTime;
          const maxDuration = 2 / (1 + gameState.stormIntensity * 2);
          const progress = Math.min(1, age / maxDuration);
          if (leader.path.length < 2) return;

          ctx.strokeStyle = `rgba(210, 225, 255, ${1 - progress * 0.35})`;
          ctx.lineWidth = Math.max(4, Math.min(8, width * 0.009));
          ctx.lineCap = 'round';
          const visibleSegments = Math.max(1, Math.ceil(progress * (leader.path.length - 1)));
          ctx.beginPath();
          ctx.moveTo(leader.path[0].x * width, leader.path[0].y * height);
          for (let i = 1; i <= visibleSegments; i++) {
            const point = leader.path[Math.min(i, leader.path.length - 1)];
            ctx.lineTo(point.x * width, point.y * height);
          }
          ctx.shadowColor = 'rgba(120, 170, 255, 0.9)';
          ctx.shadowBlur = 22;
          ctx.stroke();
          ctx.shadowBlur = 0;

          if (progress > 0.8 && !leader.interceptionSucceeded) {
            ctx.fillStyle = `rgba(200, 220, 255, ${(1 - progress) * 0.2})`;
            ctx.fillRect(0, 0, width, height);
          }
        });

        if (gameState.interceptionActive) {
          const age = gameState.time - gameState.interceptionStartTime;
          const maxDuration = 0.5;
          const radius = 56 * (1 - age / maxDuration);
          ctx.strokeStyle = `rgba(255, 211, 91, ${1 - age / maxDuration})`;
          ctx.shadowColor = '#ffd35b';
          ctx.shadowBlur = 20;
          ctx.lineWidth = 5;
          ctx.beginPath();
          ctx.arc(
            gameState.interceptionPosition.x * width,
            gameState.interceptionPosition.y * height,
            radius,
            0,
            Math.PI * 2
          );
          ctx.stroke();
          ctx.shadowBlur = 0;

          if (age > maxDuration) {
            gameState.interceptionActive = false;
          }
        }

        gameState.particles.forEach((p) => {
          const opacity = p.life / p.maxLife;
          ctx.fillStyle = `rgba(100, 150, 255, ${opacity * 0.6})`;
          ctx.beginPath();
          ctx.arc(p.x * width, p.y * height, 2, 0, Math.PI * 2);
          ctx.fill();
        });

        const ambientGlow = 0.1 + gameState.stormIntensity * 0.15;
        ctx.fillStyle = `rgba(100, 120, 180, ${ambientGlow})`;
        ctx.fillRect(0, 0, width, height);
      };

      const gameLoop = useCallback(() => {
        const gameState = gameStateRef.current;
        if (!gameState) return;

        const now = Date.now();
        const deltaTime = now - lastTimeRef.current;
        lastTimeRef.current = now;
        const elapsed = (now - gameState.startTime) / 1000;

        updateGameLogic(gameState, elapsed, deltaTime);
        renderFrame(gameState);

        setScore(Math.floor(gameState.score));
        setCombo(gameState.combo);
        setGridHealth(Math.max(0, Math.floor(gameState.gridHealth)));
        if (gameState.mode === 'sixtySecond') {
          setTime(gameState.time);
        }

        if (gameState.isGameOver) {
          setBestScore(Math.max(bestScore, gameState.score));
          localStorage.setItem('lightend_bestScore', Math.max(bestScore, gameState.score).toString());
          setScreen('gameOver');
          return;
        }

        animationIdRef.current = requestAnimationFrame(gameLoop);
      }, [bestScore]);

      const startGame = useCallback((mode) => {
        initAudio();
        setScreen('game');
        setGameMode(mode);
        const gameState = createGameState(mode);
        gameState.startTime = Date.now();
        lastTimeRef.current = Date.now();
        gameStateRef.current = gameState;
        generateStreamers(gameState);
        if (animationIdRef.current) cancelAnimationFrame(animationIdRef.current);
        gameLoop();
      }, [gameLoop, initAudio]);

      const pauseGame = () => {
        if (gameStateRef.current) {
          gameStateRef.current.isPaused = true;
          setScreen('pause');
        }
      };

      const resumeGame = () => {
        if (gameStateRef.current) {
          gameStateRef.current.isPaused = false;
          lastTimeRef.current = Date.now();
          setScreen('game');
          gameLoop();
        }
      };

      const handleCanvasClick = (e) => {
        if (screen !== 'game' || !gameStateRef.current) return;
        const canvas = canvasRef.current;
        const rect = canvas.getBoundingClientRect();
        const x = (e.clientX - rect.left) / rect.width;
        const y = (e.clientY - rect.top) / rect.height;

        const gameState = gameStateRef.current;
        if (gameState.interceptionCooldown <= 0 && !gameState.isGameOver && !gameState.isPaused) {
          gameState.interceptionActive = true;
          gameState.interceptionPosition = { x, y };
          gameState.interceptionStartTime = gameState.time;
          gameState.interceptionCooldown = 0.4;
          triggerHaptic('small');
          soundsRef.current.intercept?.();
        }
      };

      const handleTouchStart = (e) => {
        if (screen !== 'game' || !gameStateRef.current) return;
        const canvas = canvasRef.current;
        const rect = canvas.getBoundingClientRect();
        const touch = e.touches[0];
        const x = (touch.clientX - rect.left) / rect.width;
        const y = (touch.clientY - rect.top) / rect.height;

        const gameState = gameStateRef.current;
        if (gameState.interceptionCooldown <= 0 && !gameState.isGameOver && !gameState.isPaused) {
          gameState.interceptionActive = true;
          gameState.interceptionPosition = { x, y };
          gameState.interceptionStartTime = gameState.time;
          gameState.interceptionCooldown = 0.4;
          triggerHaptic('small');
          soundsRef.current.intercept?.();
        }
      };

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;

        const handleResize = () => {
          const rect = canvas.parentElement.getBoundingClientRect();
          canvas.width = rect.width;
          canvas.height = rect.height;
        };

        handleResize();
        window.addEventListener('resize', handleResize);
        return () => window.removeEventListener('resize', handleResize);
      }, []);

      useEffect(() => {
        const handleKeyDown = (e) => {
          if (e.key === 'Escape' && screen === 'game') {
            pauseGame();
          }
        };
        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, [screen]);

      return (
        <div style={{ width: '100vw', height: '100vh', margin: 0, padding: 0, overflow: 'hidden', backgroundColor: '#000' }}>
          <canvas
            ref={canvasRef}
            style={{ display: 'block', width: '100%', height: '100%', touchAction: 'none' }}
            onClick={handleCanvasClick}
            onTouchStart={handleTouchStart}
          />

          {screen === 'game' && (
            <div style={{ position: 'absolute', top: 0, left: 0, width: '100%', height: '100%', pointerEvents: 'none', display: 'flex', flexDirection: 'column', justifyContent: 'space-between', padding: '20px', boxSizing: 'border-box' }}>
              <div style={{ display: 'grid', gridTemplateColumns: '1fr auto 1fr', alignItems: 'start', color: '#d8edfa', fontWeight: 'bold', textShadow: '0 2px 12px rgba(0, 0, 0, 0.8)', paddingRight: '58px' }}>
                <div style={{ fontSize: '13px', letterSpacing: '1px', paddingTop: '8px' }}>COMBO {combo}x</div>
                <div style={{ fontSize: 'clamp(32px, 7vw, 58px)', lineHeight: 1, letterSpacing: '2px' }}>{score.toLocaleString()}</div>
                <div style={{ justifySelf: 'end', minWidth: '112px' }}>
                  <div style={{ color: '#8fdcff', fontSize: '22px', letterSpacing: '3px', marginBottom: '5px' }}>
                    <span style={{ opacity: gridHealth > 66 ? 1 : 0.2 }}>♥</span>
                    <span style={{ opacity: gridHealth > 33 ? 1 : 0.2 }}>♥</span>
                    <span style={{ opacity: gridHealth > 0 ? 1 : 0.2 }}>♥</span>
                  </div>
                  <div style={{ height: '9px', padding: '2px', border: '2px solid #7aa4c0', borderRadius: '2px', backgroundColor: '#14283a' }}>
                    <div style={{ height: '100%', width: `${gridHealth}%`, background: gridHealth > 55 ? '#73e04f' : gridHealth > 25 ? '#ffd54d' : '#ff594d', boxShadow: '0 0 8px currentColor' }} />
                  </div>
                  <div style={{ fontSize: '10px', color: '#9bc9e4', textAlign: 'center', marginTop: '4px', letterSpacing: '1px' }}>GRID POWER</div>
                </div>
              </div>
              {gameMode === 'sixtySecond' && (
                <div style={{ textAlign: 'center', color: '#6fa3ff', fontSize: '48px', fontWeight: 'bold', textShadow: '0 0 20px rgba(100, 150, 255, 0.6)' }}>
                  {60 - time}s
                </div>
              )}
              <button style={{ position: 'absolute', top: '20px', right: '20px', width: '50px', height: '50px', fontSize: '24px', backgroundColor: 'rgba(0, 0, 0, 0.5)', border: '2px solid rgba(100, 150, 255, 0.5)', color: '#6fa3ff', cursor: 'pointer', borderRadius: '4px', pointerEvents: 'auto' }} onClick={pauseGame}>
                ⏸
              </button>
            </div>
          )}

          {screen === 'menu' && (
            <div style={{ position: 'absolute', top: 0, left: 0, width: '100%', height: '100%', backgroundColor: 'rgba(0, 0, 0, 0.85)', display: 'flex', alignItems: 'center', justifyContent: 'center', zIndex: 100 }}>
              <div style={{ textAlign: 'center', color: '#6fa3ff' }}>
                <h1 style={{ fontSize: '48px', fontWeight: 'bold', margin: '0 0 10px 0', textShadow: '0 0 20px rgba(100, 150, 255, 0.8)', letterSpacing: '3px' }}>LIGHTEND</h1>
                <p style={{ fontSize: '14px', margin: '0 0 30px 0', opacity: 0.7 }}>Catch the strike before it connects</p>
                <div style={{ display: 'flex', flexDirection: 'column', gap: '10px', marginBottom: '30px' }}>
                  <button style={{ padding: '12px 24px', fontSize: '16px', fontWeight: 'bold', backgroundColor: 'rgba(100, 150, 255, 0.1)', border: '2px solid #6fa3ff', color: '#6fa3ff', cursor: 'pointer', borderRadius: '4px' }} onClick={() => startGame('survival')}>
                    SURVIVAL
                  </button>
                  <button style={{ padding: '12px 24px', fontSize: '16px', fontWeight: 'bold', backgroundColor: 'rgba(100, 150, 255, 0.1)', border: '2px solid #6fa3ff', color: '#6fa3ff', cursor: 'pointer', borderRadius: '4px' }} onClick={() => startGame('sixtySecond')}>
                    60 SECOND STORM
                  </button>
                </div>
                <div style={{ display: 'flex', gap: '20px', justifyContent: 'center', fontSize: '14px', marginBottom: '20px' }}>
                  <label style={{ cursor: 'pointer', display: 'flex', alignItems: 'center', gap: '8px' }}>
                    <input type="checkbox" checked={soundEnabled} onChange={(e) => setSoundEnabled(e.target.checked)} />
                    Sound
                  </label>
                  <label style={{ cursor: 'pointer', display: 'flex', alignItems: 'center', gap: '8px' }}>
                    <input type="checkbox" checked={hapticsEnabled} onChange={(e) => setHapticsEnabled(e.target.checked)} />
                    Haptics
                  </label>
                </div>
                {bestScore > 0 && <p style={{ fontSize: '12px', opacity: 0.6, margin: '0' }}>Best Score: {bestScore}</p>}
              </div>
            </div>
          )}

          {screen === 'pause' && (
            <div style={{ position: 'absolute', top: 0, left: 0, width: '100%', height: '100%', backgroundColor: 'rgba(0, 0, 0, 0.85)', display: 'flex', alignItems: 'center', justifyContent: 'center', zIndex: 100 }}>
              <div style={{ textAlign: 'center', color: '#6fa3ff' }}>
                <h1 style={{ fontSize: '48px', fontWeight: 'bold', margin: '0 0 30px 0', textShadow: '0 0 20px rgba(100, 150, 255, 0.8)', letterSpacing: '3px' }}>PAUSED</h1>
                <div style={{ display: 'flex', flexDirection: 'column', gap: '10px' }}>
                  <button style={{ padding: '12px 24px', fontSize: '16px', fontWeight: 'bold', backgroundColor: 'rgba(100, 150, 255, 0.1)', border: '2px solid #6fa3ff', color: '#6fa3ff', cursor: 'pointer', borderRadius: '4px' }} onClick={resumeGame}>
                    RESUME
                  </button>
                  <button style={{ padding: '12px 24px', fontSize: '16px', fontWeight: 'bold', backgroundColor: 'rgba(100, 150, 255, 0.1)', border: '2px solid #6fa3ff', color: '#6fa3ff', cursor: 'pointer', borderRadius: '4px' }} onClick={() => { if (animationIdRef.current) cancelAnimationFrame(animationIdRef.current); setScreen('menu'); }}>
                    MENU
                  </button>
                </div>
              </div>
            </div>
          )}

          {screen === 'gameOver' && (
            <div style={{ position: 'absolute', top: 0, left: 0, width: '100%', height: '100%', backgroundColor: 'rgba(0, 0, 0, 0.85)', display: 'flex', alignItems: 'center', justifyContent: 'center', zIndex: 100 }}>
              <div style={{ textAlign: 'center', color: '#6fa3ff' }}>
                <h1 style={{ fontSize: '48px', fontWeight: 'bold', margin: '0 0 10px 0', textShadow: '0 0 20px rgba(100, 150, 255, 0.8)', letterSpacing: '3px' }}>GAME OVER</h1>
                <p style={{ fontSize: '32px', fontWeight: 'bold', margin: '20px 0', textShadow: '0 0 10px rgba(100, 150, 255, 0.5)' }}>Score: {score}</p>
                {score > bestScore && <p style={{ fontSize: '20px', color: '#ffcc00', fontWeight: 'bold', textShadow: '0 0 10px rgba(255, 200, 0, 0.6)', margin: '10px 0 20px 0' }}>NEW RECORD!</p>}
                <div style={{ display: 'flex', flexDirection: 'column', gap: '10px', marginTop: '30px' }}>
                  <button style={{ padding: '12px 24px', fontSize: '16px', fontWeight: 'bold', backgroundColor: 'rgba(100, 150, 255, 0.1)', border: '2px solid #6fa3ff', color: '#6fa3ff', cursor: 'pointer', borderRadius: '4px' }} onClick={() => startGame(gameMode)}>
                    TRY AGAIN
                  </button>
                  <button style={{ padding: '12px 24px', fontSize: '16px', fontWeight: 'bold', backgroundColor: 'rgba(100, 150, 255, 0.1)', border: '2px solid #6fa3ff', color: '#6fa3ff', cursor: 'pointer', borderRadius: '4px' }} onClick={() => { if (animationIdRef.current) cancelAnimationFrame(animationIdRef.current); setScreen('menu'); }}>
                    MENU
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    };

    ReactDOM.render(<LIGHTEND />, document.getElementById('root'));
  </script>
</body>
</html>
